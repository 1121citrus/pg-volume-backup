name: CI

on:
  push:
    branches: [main, dev, staging]
    tags: ["v*"]
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  ci:
    uses: 1121citrus/shared-github-workflows/.github/workflows/pipeline.yml@v1
    with:
      image: 1121citrus/pg-volume-backup
      inject-metadata: true
      test-mode: run-all-image
      test-run-all-cmd: ./test/run-all
      test-extra-packages: gnupg
      trivyignore: .trivyignore
    secrets: inherit
