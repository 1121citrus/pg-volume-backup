# Grype ignore rules — confirmed version-string false positives only.
# Review each entry when the AL2023 package index is updated.
#
# Previously-listed entries (glibc CVE-2026-4046; python3/python3-libs
# CVE-2026-3644/4786/6100) are resolved by the current AL2023 package
# versions and no longer appear in a fresh Grype scan. Removed accordingly.

ignore:
  # urllib3: AL2023 backports security fixes inside the same upstream
  # version string ("1.25.10"), so Grype reads the stale PyPI dist-info
  # version and flags packages already carrying the fix. Confirmed via
  # `rpm -q --changelog python3-urllib3` and cross-referenced against
  # aws-backup-base's own .grype.yaml (same inherited package/finding).
  #
  # CVE-2021-33503: AL2023 confirmed "Not Affected" per alas.aws.amazon.com.
  - vulnerability: GHSA-q2q7-5pp4-w6pg
    package:
      name: urllib3
      type: python
